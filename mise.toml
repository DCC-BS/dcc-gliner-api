[tools]
uv = "0.11.31"

# ── Setup ─────────────────────────────────────────────────────────────────────

[tasks.install]
description = "🚀 Creating virtual environment using uv"
alias = "i"
sources = ["pyproject.toml", "uv.lock"]
outputs = [".venv"]
run = [
    "uv sync",
]

# ── Run ────────────────────────────────────────────────────────────────────────

[tasks.dev]
description = "Start the Ray Serve server"
run = "uv sync --quiet && .venv/bin/ray serve run serve_config.yaml"

[tasks.stop]
description = "Stop the Ray Serve server"
run = [
    # Drains the application first so in-flight scans finish, then takes the
    # local Ray cluster down with it; `serve run` exits once its app is gone.
    ".venv/bin/ray serve shutdown --yes || true",
    ".venv/bin/ray stop || true",
]

[tasks.status]
description = "Show the Ray Serve application status"
run = ".venv/bin/ray serve status"

[tasks.debug]
env = { RAY_DEBUG = 1}
run = ".venv/bin/ray serve run serve_config.yaml"

# ── Docker ──────────────────────────────────────────────────────────────────

[tasks."docker:up"]
description = "Build and start the Docker Compose stack"
run = "docker compose up -d --build"

[tasks."docker:down"]
description = "Stop the Docker Compose stack"
run = "docker compose down"

[tasks."docker:logs"]
description = "Tail docker compose logs (follow mode)"
alias = "logs"
run = "docker compose logs -f"

# ── Quality ─────────────────────────────────────────────────────────────────

[tasks."test:unit"]
description = "Run unit tests"
alias = "t"
run = "uv run pytest"

[tasks."test:integration"]
description = "Run integration tests against a running server"
run = "uv run pytest tests/test_batch_extract_entities_api.py -m integration -s"

[tasks.check]
description = "Verify lockfile, format code, lint, and type-check"
alias = "c"
run = [
    "uv lock --locked",
    "uv run ruff format",
    "uv run ruff check --fix",
    "uv run ty check ./src/dcc_gliner_api",
]

[tasks.ci-check]
description = "Verify lockfile, format code, lint, and type-check without modifying files"
run = [
    "uv lock --locked",
    "uv run ruff format --check",
    "uv run ruff check",
    "uv run ty check ./src/dcc_gliner_api",
]
