[tools]
uv = "0.11.31"

[tasks.dev]
description = "Start the Ray Serve server"
run = "uv run ray serve run src.dcc_gliner_api.app:app"

[tasks."docker:up"]
description = "Build and start the Docker Compose stack"
run = "docker compose up -d --build"

[tasks."docker:down"]
description = "Stop the Docker Compose stack"
run = "docker compose down"

[tasks."docker:logs"]
description = "Tail docker compose logs (follow mode)"
alias = "logs"
run = "docker compose logs -f"

[tasks.check]
description = "Verify lockfile, format code, lint, and type-check"
alias = "c"
run = [
    "uv lock --locked",
    "uv run ruff format",
    "uv run ruff check --fix",
    "uv run ty check ./src/anony_mate_backend",
]

[tasks.ci-check]
description = "Verify lockfile, format code, lint, and type-check without modifying files"
run = [
    "uv lock --locked",
    "uv run ruff format --check",
    "uv run ruff check",
    "uv run ty check ./src/anony_mate_backend",
]
