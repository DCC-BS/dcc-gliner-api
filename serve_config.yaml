# This file was generated using the `serve build` command on Ray v2.57.0.

proxy_location: EveryNode

http_options:
  host: 0.0.0.0
  port: 8081

grpc_options:
  port: 9000
  grpc_servicer_functions: []

logging_config:
  encoding: TEXT
  log_level: INFO
  logs_dir: null
  enable_access_log: true
  additional_log_standard_attrs: []

applications:
- name: dcc_gliner_api
  route_prefix: /
  import_path: dcc_gliner_api.app:app
  runtime_env:
    env_vars:
      # Let the allocator grow a segment instead of keeping whole blocks
      # reserved: a scan whose batch shrinks between documents otherwise
      # leaves gigabytes reserved but unusable.
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  deployments:
  - name: GLiNER2Deployment
